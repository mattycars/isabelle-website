{{- /* Embed a YouTube video, centered & responsive (matches the nbcvideo box).
       Usage: {{< youtube id="EJfyAcfE5HM" title="..." >}} or {{< youtube EJfyAcfE5HM >}} */ -}}
{{- $id := or (.Get "id") (.Get 0) -}}
{{- $title := or (.Get "title") "YouTube video" -}}
{{- with $id }}
<div class="video-embed">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ . }}" title="{{ $title }}"
    loading="lazy" frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
{{- end }}

theme = "gallery"
copyright = "© Isabelle Schmeler"
defaultContentLanguage = "en"
disableKinds = ["taxonomy"]
enableRobotsTXT = true
locale = "en-us"
timeZone = "America/New_York"
timeout = "120s"
title = "Isabelle Schmeler"

[params]
  defaultTheme = "dark"
  description = "Journalist producing stories and writing about all things politics."
  title = "Isabelle Schmeler"
  # TODO: replace placeholder contact details with Isabelle's real email / social links
  [params.author]
    email = "user@example.com"
    name = "Isabelle Schmeler"
  [params.socialIcons]
    email = "mailto:user@example.com"
  [params.gallery]

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

[imaging]
  resampleFilter = "CatmullRom"
  [imaging.jpeg]
    quality = 75
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = "ImageDescription|Orientation"

[services]
  [services.rss]
    limit = 100

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
